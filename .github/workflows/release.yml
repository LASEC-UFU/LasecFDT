name: Release LasecFDT

# Gera o instalador (MSI) e o pacote portátil e publica um Release no GitHub.
# Disparo manual: Actions → "Release LasecFDT" → Run workflow → versão (ex.: v0.2.0).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (tag), ex.: v0.2.0"
        required: true
        type: string
      publish_release:
        description: "Criar a tag e publicar o Release?"
        required: true
        default: true
        type: boolean

permissions:
  contents: write   # criar a tag e o Release

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar versão
        run: |
          $v = '${{ github.event.inputs.version }}'
          if ($v -notmatch '^v?\d+\.\d+\.\d+$') { throw "Versão inválida: $v (use vX.Y.Z)" }
          "VERSION=$($v.TrimStart('v'))" >> $env:GITHUB_ENV
          "TAG=v$($v.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: WiX Toolset 3.14
        run: |
          # O windows-latest já traz o WiX 3.14; instala só se faltar.
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'WiX Toolset v3*' -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar o WiX' }
          }
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'WiX Toolset v3*' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wix) { throw 'WiX não instalado' }
          "WIX_BIN=$($wix.FullName)\bin" >> $env:GITHUB_ENV

      # Testes que não dependem de DTMs, porta virtual nem hardware (os demais se marcam como ignorados no runner).
      - name: Testes (sem hardware)
        run: |
          dotnet test tests/LasecFDT.Tests -c Release --nologo --filter "FullyQualifiedName~HostTests|FullyQualifiedName~SchemaLocatorTests"

      - name: Build do instalador
        run: |
          ./tools/release/build-release.ps1 -Version $env:VERSION -WixDir $env:WIX_BIN

      - name: Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: LasecFDT-${{ env.VERSION }}
          path: |
            artifacts/LasecFDT-${{ env.VERSION }}.msi
            artifacts/LasecFDT-${{ env.VERSION }}-portable.zip

      - name: Publicar Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: LasecFDT ${{ env.TAG }}
          body: |
            **LasecFDT ${{ env.TAG }}**: Frame FDT 1.2 com interface moderna, para estações e servidores de terminal (thin clients).

            ## ⚠️ Antes de usar: schemas HART

            O LasecFDT **não pode distribuir os schemas XML do protocolo HART da FDT**, por causa da licença do FDT Group. Sem eles, os DTMs HART abrem e dizem que conectaram, mas **não trocam dados com o instrumento**. Escolha uma das opções:

            1. **PACTware no mesmo computador** (mais simples): instale o PACTware (gratuito, [www.pactware.com](http://www.pactware.com)). O LasecFDT encontra sozinho os schemas que ele instala.
            2. **Especificação FDT da PROFIBUS:** baixe a *FDT Interface Specification* (FDT 1.2, PNO 2.162) em https://www.profibus.com/download/fdt-interface-specification. O site pede cadastro. Na lista de downloads, baixe **`FDTSpecV12+Addendum(2162_V12+2162_Add).zip`** (o `FDTSpecV121+Addendum.zip` não serve: não traz os schemas HART). **Não precisa descompactar:** copie o .zip do jeito que veio (ou só os `.xml` da pasta `XML-Files` dele) para **`C:\ProgramData\LasecFDT\Schemas\`**. Essa pasta é criada pelo instalador e tem um `LEIA-ME.txt`. Feche e abra o LasecFDT.
            3. **Avançado:** a variável de ambiente `LASECFDT_SCHEMA_PATH` aponta para uma pasta completa de schemas e substitui as opções acima.

            ## Instalação

            Execute `LasecFDT-${{ env.VERSION }}.msi` como administrador. No servidor de terminal, basta uma vez para todas as estações.
            - Instala em `C:\Program Files (x86)\LasecFDT` (UI + motor em `engine\`).
            - Cria `C:\ProgramData\LasecFDT`, a pasta compartilhada entre as estações (projetos, catálogo, bloqueios e `Schemas\`), com permissão de escrita para Usuários.
            - Inclui os componentes oficiais redistribuíveis da FDT 1.2.1: FDT100.dll (compartilhada, com contagem de referência) e os schemas XML do Frame.

            **Requisitos:** Windows 10/11 ou Windows Server 2019+, .NET Framework 4.8, os DTMs FDT 1.x dos instrumentos instalados no mesmo computador e os schemas HART (acima).

            `LasecFDT-${{ env.VERSION }}-portable.zip`: os mesmos arquivos, sem instalação. Não traz os componentes FDT, que exigem o MSI.
          files: |
            artifacts/LasecFDT-${{ env.VERSION }}.msi
            artifacts/LasecFDT-${{ env.VERSION }}-portable.zip
